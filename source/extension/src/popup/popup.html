<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>mem0</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="panel" id="panel">
    <header class="tp-top">
      <img class="tp-logo" src="brand/mem0-mark.png" alt="mem0" draggable="false" />
      <span class="tp-word">mem0</span>
      <span id="conn-state" class="pill">…</span>
    </header>

    <section class="tp-stats">
      <div class="tp-card">
        <div class="tp-lbl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5v14m0 0 5.5-5.5M12 18.5 6.5 13"/></svg>本页备份</div>
        <div class="tp-num"><b id="st-page">–</b><span>条消息</span></div>
      </div>
      <div class="tp-card">
        <div class="tp-lbl"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>等待同步</div>
        <div class="tp-num accent"><b id="st-queued">0</b><span>个对话</span></div>
      </div>
    </section>

    <section id="conn" class="tp-sec">
      <div class="tp-h">桌面端</div>
      <div class="tp-row">
        <span class="av md"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16.5V20"/></svg></span>
        <span class="tp-main">
          <span class="tp-t">mem0 桌面端</span>
          <span id="conn-detail" class="tp-sub wrap"></span>
        </span>
      </div>
      <form id="pair-form" class="pair hidden">
        <div class="pair-hint">在 mem0 桌面端「连接 → 配对」，<br />把 6 位数字填到这里</div>
        <div class="pair-row"><input id="code" inputmode="numeric" maxlength="6" placeholder="配对码" autocomplete="off" spellcheck="false" /><button type="submit" class="btn">配对</button></div>
        <div id="pair-msg" class="small"></div>
      </form>
    </section>

    <section class="tp-sec">
      <div class="tp-h row"><span>当前页面</span><span id="page-state" class="pill">…</span></div>
      <div class="tp-row">
        <span class="av md" id="page-av"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg></span>
        <span class="tp-main"><span id="page-detail" class="page-detail"></span></span>
      </div>
    </section>

    <section class="tp-sec sites">
      <div class="tp-h row"><span>备份网站</span><label class="pause"><span>暂停备份</span><span class="switch"><input id="paused" type="checkbox" /><span></span></span></label></div>
      <div id="platforms" class="chips"></div>
    </section>

    <footer class="tp-foot">
      <span id="queued" class="foot-note"></span>
      <button id="unpair" class="tp-ghost" type="button">解除配对</button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
